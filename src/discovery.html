<template id="discoveryIntroTemplate">
 <div class="discovery intro-story">
  <header class="intro-topbar"><span class="intro-brand">蓝染小记</span></header>
  <div id="introDeck" class="intro-deck" role="button" tabindex="0" aria-label="蓝染介绍，点击翻页">
   <section class="intro-slide is-active" aria-labelledby="introBlueTitle">
    <div class="intro-image"><img src="__INTRO_ART_BLUE__" alt="蓝草、靛蓝染液与染布" width="1254" height="1254"></div>
    <div class="intro-copy"><span class="intro-eyebrow">壹 · 蓝染的历史</span><h1 id="introBlueTitle">蓝染</h1><p class="intro-subtitle">先秦时期，已有蓝草染色的文字记载。</p><p>战国时期，《荀子·劝学》用“青，取之于蓝”说明染蓝技术。后来，人们将蓝草制成可保存、运输的蓝靛，让染色不再受采收季节限制。</p><span class="intro-seal">蓝染</span></div>
   </section>
   <section class="intro-slide" aria-hidden="true" aria-labelledby="introTieTitle">
    <div class="intro-image"><img src="__INTRO_ART_TIE__" alt="扎紧的布料、棉线与蓝白扎染纹样" width="1254" height="1254"></div>
    <div class="intro-copy"><span class="intro-eyebrow">贰 · 扎染的渊源</span><h2 id="introTieTitle">扎染</h2><p class="intro-subtitle">古称“绞缬”，至迟公元 4 世纪已有。</p><p>扎染在唐代兴盛，后来在云南、四川等地发展出地方特色。云南大理周城的白族扎染长期代代相传，先扎花、再浸染，线缝扎紧的地方留下白色纹样。</p><span class="intro-seal">扎染</span></div>
   </section>
   <section class="intro-slide" aria-hidden="true" aria-labelledby="introWaxTitle">
    <div class="intro-image"><img src="__INTRO_ART_WAX__" alt="蜡刀、蜂蜡与蓝白蜡染布" width="1254" height="1254"></div>
    <div class="intro-copy"><span class="intro-eyebrow">叁 · 蜡染的渊源</span><h2 id="introWaxTitle">蜡染</h2><p class="intro-subtitle">古称“蜡缬”，魏晋时期已有实物线索。</p><p>中国丝绸博物馆介绍，魏晋时期的西北地区已出现点蜡防染丝织物。蜡染后来在贵州等地长期传承；蜡层阻挡染液，细小裂纹则形成特有的“冰纹”。</p><span class="intro-seal">蜡染</span></div>
   </section>
   <section class="intro-slide intro-journey" aria-hidden="true" aria-labelledby="introProcessTitle">
    <div class="intro-copy"><span class="intro-eyebrow">肆 · 传统染织</span><h2 id="introProcessTitle">蓝白纹样从何而来</h2><p class="intro-subtitle">扎染与蜡染，都是先防染，再染色。</p><ol class="intro-journey-steps">
     <li><b>选布</b><span>挑一件想染的布艺</span></li><li><b>留白</b><span>画蜡，或揪布绑结</span></li><li><b>入染</b><span>浸泡，等待染液渗入</span></li><li><b>清洗</b><span>冲去布面多余染液</span></li><li><b>揭纹</b><span>去蜡、松绑，纹样显现</span></li><li><b>晾晒</b><span>让风吹过，青绿成蓝</span></li>
    </ol></div>
   </section>
  </div>
  <footer class="intro-footer">
   <div class="intro-pagination" aria-label="介绍页码"><div id="introDots"><i class="is-current"></i><i></i><i></i><i></i></div><span id="introCounter" aria-live="polite">01 / 04</span></div>
   <div class="intro-actions"><button id="introSkip" class="intro-return" type="button" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button><button id="introStart" class="intro-start" type="button">跳过介绍，开始制作</button></div>
  </footer>
 </div>
</template>

<template id="discoveryPlayTemplate">
  <div class="discovery product-room">
    <div class="discovery-overline"><span>作品 · 布上生活</span><span class="discovery-optional">成品搭配</span></div>
    <p class="product-lead">带上自己染的蓝</p>
    <p class="product-kind" id="productTote"><svg class="ph" aria-hidden="true"><use href="#ph-tote"/></svg>帆布袋</p>
    <div class="product-preview-wrap"><canvas id="productPreview" width="960" height="1200" aria-label="布料成品预览"></canvas><span id="productPreviewTag" class="product-preview-tag"></span></div>
    <p id="productStatus" class="product-status" role="status" aria-live="polite"></p>
    <div class="product-source-heading"><span>选择一方布</span><span id="productSourceCount"></span></div>
    <div id="productSources" class="product-sources" aria-label="可用的布料"></div>
    <div id="productEmpty" class="product-empty" hidden><p>还没有自己的作品。先用示意纹样看看，<br>也可以染一方，再带它来这里。</p><button id="productStart" class="outline-btn">去染第一方</button></div>
    <div class="product-adjust"><label for="productScale">纹样大小</label><input id="productScale" type="range" min="100" max="180" step="5" value="100"><output id="productScaleValue" for="productScale">100%</output></div>
    <button id="productExport" class="primary" disabled>保存成品预览图</button>
    <p class="discovery-note">数字搭配预览 · 图案裁切随成品形状变化</p>
  </div>
</template>
